; ============================================================
; Waveshare ESP32-S3-Touch-LCD-4 (480x480) – NauticPinnace
; PlatformIO configuration
; ============================================================
[platformio]
default_envs = waveshare_esp32s3_4   ; normal build/upload uses only this env
                                      ; full deploy: pio run -t deploy

[env:waveshare_esp32s3_4]
; Arduino-ESP32 3.20017.241212 (ESP-IDF 4.4.7) — the only version available via
; PlatformIO.  NOTE: ESP-IDF 4.4.7 has a known OPI PSRAM coherency bug that
; causes ~13-second crash cycles when the canvas writes PSRAM concurrently with
; WiFi DMA.  Upgrading to Arduino-ESP32 3.x / ESP-IDF 5.x would fix this but
; that framework package is not yet in the PlatformIO registry.
platform = espressif32
board = waveshare_esp32_s3_touch_lcd_4
framework = arduino

; --- Flash / PSRAM -----------------------------------------------------------
board_build.arduino.memory_type = qio_opi   ; 16MB QIO Flash + 8MB OPI PSRAM
board_build.flash_mode = qio
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = partitions_16MB.csv
board_build.filesystem = littlefs          ; use LittleFS format (not SPIFFS) for uploadfs

; --- Build speed -------------------------------------------------------------
; ccache: if ccache is installed (scoop/choco/winget install ccache),
; extra_script.py wraps the compiler automatically – no-op otherwise.
extra_scripts = pre:extra_script.py

; --- USB CDC (used for Serial monitor) --------------------------------------
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    ; LVGL – place lv_conf.h in src/
    -DLV_CONF_INCLUDE_SIMPLE
    -DLV_LVGL_H_INCLUDE_SIMPLE
    -I src
    ; Log level: 3=INFO 4=DEBUG
    -DCORE_DEBUG_LEVEL=3
    -DLOG_LOCAL_LEVEL=ESP_LOG_INFO
    -Os
    -pipe   ; avoid temp files between compiler stages
    ; NOTE: the -ffile-prefix-map flags that keep the build machine's paths (and
    ; thus the developer's account name) out of firmware.bin are added by
    ; extra_script.py — they cannot be written here because the paths contain
    ; spaces and backslashes that this file's parser mangles.   ; avoid temp files between compiler stages

; --- Serial monitor ----------------------------------------------------------
monitor_speed = 115200
monitor_filters =
    esp32_exception_decoder
    time

; --- Upload ------------------------------------------------------------------
upload_speed = 921600
;upload_protocol = esp-builtin   ; OpenOCD over built-in USB-JTAG – bypasses CDC crash loop
; upload_port = COM3   ; uncomment and set your port

; --- Libraries ---------------------------------------------------------------
lib_deps =
    ; Display + Touch driver
    lovyan03/LovyanGFX @ ^1.1.16
    ; GUI framework
    lvgl/lvgl @ ^8.4.0
    ; NMEA 2000 (NMEA2000_esp32 replaced by local lib/NMEA2000_esp32 – TWAI-based, S3-compatible)
    https://github.com/ttlappalainen/NMEA2000.git
    ; Config / JSON
    bblanchon/ArduinoJson @ ^7.2.0
    ; Web server (async): AsyncTCP 3.3.2 + ESPAsyncWebServer 3.6.0.
    ; NOTE the URLs are historic — me-no-dev handed both projects over to the
    ; ESP32Async organisation, so these redirect there and the pinned commits
    ; are ESP32Async commits (their library.json/library.properties name
    ; ESP32Async as author). Same lineage, just older versions.
    ; PINNED ON PURPOSE: the current releases (AsyncTCP 3.5, WebServer 3.12)
    ; stall large responses after ~4 KB on this Arduino core (2.0.17) — the
    ; UI page never finishes loading. These two commits have run stable for
    ; weeks, and unpinning also pulls a SECOND AsyncTCP copy into libdeps.
    ; Retry after an Arduino-core upgrade. Versions/commits/licences are
    ; documented in THIRD-PARTY-NOTICES.md.
    https://github.com/me-no-dev/AsyncTCP.git#ef448a8a
    https://github.com/me-no-dev/ESPAsyncWebServer.git#ad3741d1

; NOTE: there is deliberately NO env with "targets = uploadfs, upload" — both
; targets resolve to littlefs.bin in one run, so the firmware is silently
; skipped (verified). Full deploy = the custom "deploy" target from
; extra_script.py, which runs uploadfs and upload as two separate invocations:
;   pio run -t deploy

; ============================================================
; PC Simulator – runs on Windows/Linux with SDL2.
; Requires SDL2:
;   Windows (scoop):       scoop install sdl2
;   Windows (chocolatey):  choco install sdl2
;   Windows (winget):      winget install SDL2
;   Ubuntu/Debian:         sudo apt install libsdl2-dev
;
; Build:  pio run -e simulator
; Run:    .pio\build\simulator\program.exe
; ============================================================
[env:simulator]
platform = native
build_type = debug
build_flags =
    -DSIMULATOR
    -DLVGL_SIMULATOR
    -DLV_CONF_INCLUDE_SIMPLE
    -DLV_LVGL_H_INCLUDE_SIMPLE
    ; Force-include simulator_defines.h as first file in every translation unit.
    ; This neutralises ESP32-specific attributes (IRAM_ATTR etc.) before any
    ; LVGL header can use them.
    -include sim/simulator_defines.h
    -I sim
    -I sim/freertos
    -I src
    -I src/display
    -D_REENTRANT
    ; SDL2 Pfade – passe an deine Installation an:
    ;   scoop:       C:/Users/NAME/scoop/apps/sdl2/current/include
    ;   manuell:     C:/SDL2/include
    -IC:/SDL2/include
    -LC:/SDL2/lib
    ; Falls scoop: diese Zeilen statt den oberen:
    ; -IC:/Users/<USER>/scoop/apps/sdl2/current/include
    ; -LC:/Users/<USER>/scoop/apps/sdl2/current/lib/x64
    -fpermissive
    -m64
    -lmingw32
    -lSDL2main
    -lSDL2
    -std=c++17
lib_deps =
    lvgl/lvgl @ ^8.4.0
    bblanchon/ArduinoJson @ ^7.2.0
build_src_filter =
    +<../sim/sim_main.cpp>
    +<../sim/sim_hal.cpp>
    +<../src/display/DisplayManager.cpp>
    +<../src/display/ConfigOverlay.cpp>
    +<../src/display/LicenseOverlay.cpp>
    +<../src/display/LanguageOverlay.cpp>
    +<../src/display/Theme.cpp>
    +<../src/display/CanvasDraw.cpp>
    +<../src/display/BootScreen.cpp>
    ; hero numeric fonts + the latin_suppl_* umlaut fallbacks
    +<../src/display/fonts/*.c>
    +<../src/display/screens/WindScreen.cpp>
    +<../src/display/screens/SpeedScreen.cpp>
    +<../src/display/screens/DepthScreen.cpp>
    +<../src/display/screens/EngineScreen.cpp>
    +<../src/display/screens/RudderScreen.cpp>
    +<../src/display/screens/AutopilotScreen.cpp>
    +<../src/display/screens/GridScreen.cpp>
    +<../src/display/screens/AisScreen.cpp>
    +<../src/display/screens/WindPlotScreen.cpp>
    +<../src/display/screens/FusionScreen.cpp>
    +<../src/display/screens/AnchorScreen.cpp>
    +<../src/display/screens/TankScreen.cpp>
    +<../src/display/screens/BatteryScreen.cpp>
    +<../src/display/screens/WeatherScreen.cpp>
    +<../src/display/screens/ClockScreen.cpp>
    +<../src/display/screens/VmgScreen.cpp>
    +<../src/display/screens/RouteScreen.cpp>
    +<../src/nmea/DemoData.cpp>
    +<../src/nmea/FusionN2k.cpp>
    ; N2kHandler.cpp EXCLUDED – uses ESP32 TWAI/CAN hardware not available on PC
    +<../src/config/Config.cpp>
    +<../src/i18n/I18n.cpp>
    +<../src/PsramArena.cpp>
    +<../src/PolarTable.cpp>
