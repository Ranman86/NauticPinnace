; ============================================================
; Waveshare ESP32-S3-Touch-LCD-4 (480x480) – NauticPinnace
; PlatformIO configuration
; ============================================================
[platformio]
default_envs = waveshare_esp32s3_4   ; normal build/upload uses only this env
; Build output lives OUTSIDE the project tree: the 7B env recompiles the
; Arduino IDF libs from source (custom_sdkconfig / HybridCompile), and that
; build refuses any whitespace in BUILD_DIR - which "Waveshare ESP32-S3"
; contains. The platform checks FRAMEWORK_DIR and BUILD_DIR only, so moving
; build_dir to a space-free path is sufficient; the project itself may stay
; where it is. Costs one full rebuild per env (the cache starts empty there).
;
; Written as an interpolation, NOT an absolute path. core_dir is PlatformIO's
; own directory (~/.platformio), so this resolves per machine and the file
; carries no author's home directory - which would otherwise be both a name in
; a public repository and a path nobody else can build into.
; Override with the PLATFORMIO_BUILD_DIR environment variable if your own home
; directory contains a space, which would bring the original problem back.
build_dir = ${platformio.core_dir}/build/nauticpinnace
                                      ; full deploy: pio run -t deploy

[env:waveshare_esp32s3_4]
; Exactly one display backend is compiled. This board uses LovyanGFX
; (DisplaySetup.cpp); the 7B one must stay out or its duplicate
; definitions of displayInit() and friends collide at link time.
build_src_filter = +<*> -<DisplaySetup_7B.cpp>
; Arduino-ESP32 3.20017.241212 (ESP-IDF 4.4.7) — the only version available via
; PlatformIO.  NOTE: ESP-IDF 4.4.7 has a known OPI PSRAM coherency bug that
; causes ~13-second crash cycles when the canvas writes PSRAM concurrently with
; WiFi DMA.  Upgrading to Arduino-ESP32 3.x / ESP-IDF 5.x would fix this but
; that framework package is not yet in the PlatformIO registry.
; PINNED ON PURPOSE. The 7B env installs pioarduino from a URL, and that
; package is ALSO called espressif32 - installing it replaced the registry
; platform in place and silently dragged this board onto Arduino 3.x too.
; Naming an explicit version keeps the two side by side. This one must stay
; on the core that v1.0.0 was released and tested with.
platform = espressif32@6.12.0
; The FRAMEWORK package is the dir both platforms actually fight over: the
; pioarduino platform (7B env) ships its own "framework-arduinoespressif32"
; (3.3.11) into the same unversioned package dir, and the Tool Manager's
; re-unpack of 2.0.17 over it produced a 2.x/3.x MIXED tree (HWCDC.h missing
; etc.). The explicit exact pin makes the requirement unambiguous so the
; manager keeps/installs this version side by side instead of "satisfying"
; the spec with whatever occupies the dir.
platform_packages = platformio/framework-arduinoespressif32 @ ~3.20017.0
; BUILD THIS ENV VIA tools/build4.ps1 (sets PLATFORMIO_PACKAGES_DIR to a
; private package dir). Background: this platform and the 7B's pioarduino
; platform resolve packages BY NAME in one shared dir; tool-esptoolpy (2.x
; here, a 5.3.0 zip there) evicts the other side on every board switch, and
; the first 7B run after a 4" build then dies mid-reinstall with the fast
; "Path/None" TypeError (pioarduino manages the tool outside the normal spec
; mechanics, so neither version pins nor symlink:// specs end the fight -
; all three were tried and measured). A separate packages dir for THIS
; rarely-built env is the only clean cut. It duplicates ~1.5 GB of
; toolchain downloads, never any source code. The framework pin above stays
; as a belt-and-braces guard for accidental unwrapped builds.
board = waveshare_esp32_s3_touch_lcd_4
framework = arduino

; --- Flash / PSRAM -----------------------------------------------------------
board_build.arduino.memory_type = qio_opi   ; 16MB QIO Flash + 8MB OPI PSRAM
board_build.flash_mode = qio
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = partitions_16MB.csv
board_build.filesystem = littlefs          ; use LittleFS format (not SPIFFS) for uploadfs

; --- Build speed -------------------------------------------------------------
; ccache: if ccache is installed (scoop/choco/winget install ccache),
; extra_script.py wraps the compiler automatically – no-op otherwise.
extra_scripts = pre:extra_script.py

; --- USB CDC (used for Serial monitor) --------------------------------------
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    ; LVGL – place lv_conf.h in src/
    -DLV_CONF_INCLUDE_SIMPLE
    -DLV_LVGL_H_INCLUDE_SIMPLE
    -I src
    ; Log level: 3=INFO 4=DEBUG
    -DCORE_DEBUG_LEVEL=3
    -DLOG_LOCAL_LEVEL=ESP_LOG_INFO
    -Os
    -pipe   ; avoid temp files between compiler stages
    ; NOTE: the -ffile-prefix-map flags that keep the build machine's paths (and
    ; thus the developer's account name) out of firmware.bin are added by
    ; extra_script.py — they cannot be written here because the paths contain
    ; spaces and backslashes that this file's parser mangles.   ; avoid temp files between compiler stages

; --- Serial monitor ----------------------------------------------------------
monitor_speed = 115200
monitor_filters =
    esp32_exception_decoder
    time

; --- Upload ------------------------------------------------------------------
upload_speed = 921600
;upload_protocol = esp-builtin   ; OpenOCD over built-in USB-JTAG – bypasses CDC crash loop
; upload_port = COM3   ; uncomment and set your port

; --- Libraries ---------------------------------------------------------------
lib_deps =
    ; Display + Touch driver
    lovyan03/LovyanGFX @ ^1.1.16
    ; GUI framework
    lvgl/lvgl @ ^8.4.0
    ; NMEA 2000 (NMEA2000_esp32 replaced by local lib/NMEA2000_esp32 – TWAI-based, S3-compatible)
    https://github.com/ttlappalainen/NMEA2000.git
    ; Config / JSON
    bblanchon/ArduinoJson @ ^7.2.0
    ; Web server (async): AsyncTCP 3.3.2 + ESPAsyncWebServer 3.6.0.
    ; NOTE the URLs are historic — me-no-dev handed both projects over to the
    ; ESP32Async organisation, so these redirect there and the pinned commits
    ; are ESP32Async commits (their library.json/library.properties name
    ; ESP32Async as author). Same lineage, just older versions.
    ; PINNED ON PURPOSE: the current releases (AsyncTCP 3.5, WebServer 3.12)
    ; stall large responses after ~4 KB on this Arduino core (2.0.17) — the
    ; UI page never finishes loading. These two commits have run stable for
    ; weeks, and unpinning also pulls a SECOND AsyncTCP copy into libdeps.
    ; Retry after an Arduino-core upgrade. Versions/commits/licences are
    ; documented in THIRD-PARTY-NOTICES.md.
    ;
    ; FULL 40-character hashes, not the short form these used to carry. Git
    ; cannot fetch an abbreviated commit: PlatformIO installs a pin by running
    ; `git init` followed by `git fetch <url> <ref>`, and a server can only
    ; answer that for a ref name or a complete object id - GitHub rejects
    ; `ef448a8a` with "couldn't find remote ref". The short form therefore only
    ; ever worked while the package already sat in .pio/libdeps; from a clean
    ; checkout - anyone cloning this repository - it could never resolve.
    ; Verified: `git fetch <url> ef448a8a` fails, the full id below succeeds.
    https://github.com/me-no-dev/AsyncTCP.git#ef448a8a1dffe4ec1b72326dd5a26211ff227b49
    https://github.com/me-no-dev/ESPAsyncWebServer.git#ad3741d159f9cfd50c567e81b67f3bef1dc6d89f

; ============================================================
; Waveshare ESP32-S3-Touch-LCD-7B (1024x600) - port in progress
;
; Inherits everything from the 4" env (libraries, extra_script, monitor
; settings) and changes only what the hardware forces:
;
;   * its own board definition, plus BOARD_WAVESHARE_7B which makes
;     BoardConfig.h pull in BoardConfig_7B.h instead of BoardConfig_4.h
;
;   * USB CDC OFF - this is the one that bites. On the 4" the console is the
;     ESP32-S3's native USB. Here GPIO19/20 carry CAN, so the board has an
;     onboard CH343 bridge and the console is plain UART0. With
;     ARDUINO_USB_CDC_ON_BOOT=1 Serial would be routed to a USB device that
;     does not exist and the board would stay completely silent.
;
; HARDWARE NOTE: the onboard DIP switch must be set to UART1. In the other
; position the COM port enumerates normally but never delivers a single byte,
; in either direction, and esptool fails with "No serial data received".
;
; Build:  pio run -e waveshare_esp32s3_7b
; ============================================================
[env:waveshare_esp32s3_7b]
; Deliberately NOT extending the 4" env any more: this board runs a DIFFERENT
; core. ESP-IDF 4.4 has no bounce buffers for the RGB panel, and without them a
; 1024x600 frame buffer in PSRAM smears as soon as the application touches
; PSRAM as well - which our canvas screens do constantly. Measured on the real
; panel: rock solid in an idle bring-up at 40 MHz, torn under the full firmware
; even down at 30 MHz. Bounce buffers are exactly the fix, and they arrived in
; ESP-IDF 5.x, so this env uses pioarduino's Arduino 3.3.11 / ESP-IDF 5.5.5.
;
; The 4" board stays on its proven core on purpose - v1.0.0 is released and
; people flash it from the browser. One board migrates, the other does not.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = waveshare_esp32_s3_touch_lcd_7b
framework = arduino

; tool-esptoolpy is the framework fight in small: this platform ships a
; 5.3.0 zip, the 4" platform wants registry ~2.4, and unpinned they take
; turns replacing the ONE unversioned package dir (first 7B run after a 4"
; build then dies with the fast "Path/None" TypeError mid-install). The
; explicit URL spec here makes the manager keep the 7B copy in its own
; "@src-<hash>" dir - same mechanism that already separates the frameworks.
platform_packages = tool-esptoolpy@https://github.com/pioarduino/registry/releases/download/0.0.1/esptoolpy-v5.3.0.zip

board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = partitions_16MB.csv
board_build.filesystem = littlefs

; esp_lcd backend instead of the LovyanGFX one - see DisplaySetup_7B.cpp
build_src_filter = +<*> -<DisplaySetup.cpp>

; ccache via extra_script.py. The script skips its -ffile-prefix-map rules for
; hybrid-compile envs (see the guard there) - they would split on the spaced
; project path inside the libs rebuild.
extra_scripts = pre:extra_script.py

; --- IRAM-safe LCD ISR (the drift fix) ---------------------------------------
; The picture drifts because the RGB panel's ISR lives in flash: whenever the
; flash cache is busy (LittleFS writes, cache misses) the ISR is delayed, the
; bounce buffers underrun, and CONFIG_LCD_RGB_RESTART_IN_VSYNC re-aligns the
; frame - visible as continuous drift. The shipped prebuilt libs have
;   # CONFIG_LCD_RGB_ISR_IRAM_SAFE is not set
;   # CONFIG_GDMA_ISR_IRAM_SAFE  is not set
; (CONFIG_GDMA_CTRL_FUNC_IN_IRAM is already =y there.)
; custom_sdkconfig makes pioarduino recompile the Arduino IDF libs from source
; with these merged in ("HybridCompile"). First build takes a long time.
; The flag set below is research-backed, not guessed (checked against ESP-IDF
; v5.5 sources, the Espressif RGB-drift FAQ, and field reports):
;
;   SPIRAM_XIP_FROM_PSRAM   THE decisive fix (esp-idf #15013: worked after
;                           everything else failed; docs: bounce-buffer mode
;                           "CANNOT function" while the flash cache is off).
;                           Code+rodata move to PSRAM, cache survives flash
;                           writes. Tested on octal PSRAM - our exact fit;
;                           crashes were reported only on QIO+QIO boards.
;   LCD_RGB_ISR_IRAM_SAFE   keeps the bounce-buffer ISR alive in those windows.
;                           Alone it fixes nothing (#10010), needed with XIP.
;   GDMA_CTRL_FUNC_IN_IRAM  the ISR restart path (gdma_reset/start) must not
;                           live in flash; NOT auto-selected in v5.5.
;                           (GDMA_ISR_IRAM_SAFE is deprecated in v5.5 - esp_lcd
;                           sets the per-channel flag itself; deliberately NOT
;                           listed here.)
;   LCD_RGB_RESTART_IN_VSYNC=n  default y in the prebuilt libs and identified
;                           in esp-idf #16893 as the cause of PERMANENT desync
;                           under WiFi/flash load; the v5.5 driver detects
;                           underruns and restarts on its own.
;   DATA_CACHE_LINE_64B     Espressif FAQ: 64B is the correct line size WITH
;                           bounce buffers (32B only without).
;   COMPILER_OPTIMIZATION_PERF  -O2 for the IDF libs, FAQ-recommended; our app
;                           sources keep their own -Os from build_flags.
;   COMPILER_HIDE_PATHS_MACROS=n  build fix, not display-related: IDF's
;                           default-on "-fmacro-prefix-map=<project>=." breaks
;                           on our spaced project path (argument gets split ->
;                           "invalid argument ... to '-fmacro-prefix-map'").
;                           Release-binary path privacy is unaffected (that is
;                           extra_script.py in the 4" env; the 7B ships later).
custom_sdkconfig =
    CONFIG_LCD_RGB_ISR_IRAM_SAFE=y
    CONFIG_GDMA_CTRL_FUNC_IN_IRAM=y
    CONFIG_SPIRAM_XIP_FROM_PSRAM=y
    CONFIG_ESP32S3_DATA_CACHE_LINE_64B=y
    CONFIG_COMPILER_OPTIMIZATION_PERF=y
    CONFIG_LCD_RGB_RESTART_IN_VSYNC=n
    CONFIG_COMPILER_HIDE_PATHS_MACROS=n
    CONFIG_ESP_WIFI_STATIC_RX_BUFFER_NUM=6
    CONFIG_ESP_WIFI_DYNAMIC_RX_BUFFER_NUM=12
    CONFIG_ESP_WIFI_DYNAMIC_TX_BUFFER_NUM=12
; SPIRAM_TRY_ALLOCATE_WIFI_LWIP was here and is GONE ON PURPOSE. It solved the
; DRAM shortage but placed the WiFi RX/TX processing on the PSRAM bus - the
; single most contended resource in this system (LCD scan-out pulls ~50 MB/s
; there continuously). Under web traffic the packet queues drained slower than
; they filled and the STA data path wedged every 1-2 minutes while the driver
; kept reporting CONNECTED; AMPDU-off and even pinning 11b/g changed nothing,
; which exonerated the radio layer and convicted the bus. The wedge never
; existed before this flag was introduced. The DRAM to afford internal WiFi
; buffers again came from: BSH task stack -> PSRAM (12.3 KB), LVTICK task
; removed via LV_TICK_CUSTOM (4.1 KB), draw scratch arrays -> arena (3.8 KB).
    CONFIG_MBEDTLS_EXTERNAL_MEM_ALLOC=y
    CONFIG_ESP_WIFI_AMPDU_TX_ENABLED=n
    CONFIG_ESP_WIFI_AMPDU_RX_ENABLED=n
; AMPDU off: under web-traffic bursts the STA data path died completely while
; the driver kept reporting CONNECTED (beacons/RSSI fine, ARP/ICMP/TCP dead;
; reproduced with a 6-connection parallel fetch). Frame aggregation is the
; classic culprit for exactly this wedge on ESP32-S3 STAs. Costs peak
; throughput - irrelevant for a config UI. The gateway probe in WebConfig
; catches any remaining occurrences and self-heals within ~45 s.
; The last four lines exist because IDF 5.5's WiFi is far hungrier for
; internal RAM than 4.4 was: with stock buffers, starting the SoftAP left
; 3,720 bytes (!) of free DRAM - measured, byte-stable, and one web request
; away from collapse. SPIRAM_TRY_ALLOCATE_WIFI_LWIP moves the non-DMA
; WiFi/lwIP allocations into PSRAM; the buffer counts are trimmed because a
; config web UI does not need 32-deep RX/TX queues. This project has been
; killed by DRAM exhaustion twice before (WebConfig history on the 4") -
; DRAM in the heartbeat line is the number to watch.
; MBEDTLS_EXTERNAL_MEM_ALLOC: with 13 KB of free DRAM a TLS handshake
; (~40 KB) can never succeed - the BSH tide HTTPS client failed with
; "SSL - Memory allocation failed". This routes mbedTLS through PSRAM.
; libsodium is the ONE managed component whose port injects a forced-include
; carrying the (spaced) project path - its two crypto_aead units die with
; "<command-line>: fatal error: <first word of the project path>: No such file
; or directory", i.e. the compiler reads the space as an argument separator.
; Nothing depends on it transitively (verified across all
; managed components' manifests); it only backs the Arduino "Sodium" wrapper
; library, which this firmware never includes. Removing it beats patching
; platform code that a platform reinstall would silently revert.
custom_component_remove =
    espressif/libsodium

build_flags =
    -DBOARD_HAS_PSRAM
    ; Board identity: picks BoardConfig_7B.h in the BoardConfig.h dispatcher.
    -DBOARD_WAVESHARE_7B
    ; Panel-class feature flag, shared by every 1024x600 board (7B and 5").
    ; ALL the UI work (600-grid screens, rail + sidebar, home launcher, bigger
    ; fonts, arena/pool sizes) keys off THIS macro, not off the board identity -
    ; so a second 1024x600 board inherits it by setting the same flag.
    -DBOARD_PANEL_1024X600
    ; Console is UART0 via the onboard CH343, NOT native USB - GPIO19/20 carry
    ; CAN here. With CDC on boot Serial would go to a device that does not exist.
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DLV_CONF_INCLUDE_SIMPLE
    -DLV_LVGL_H_INCLUDE_SIMPLE
    -I src
    -DCORE_DEBUG_LEVEL=3
    -DLOG_LOCAL_LEVEL=ESP_LOG_INFO
    ; AsyncTCP 3.5 knobs (both honored via #ifndef in AsyncTCP.h):
    ; USE_WDT=0 - its service task self-subscribes to the TWDT; when that add
    ;   fails, EVERY handled event logs "task_wdt: task not found" (~267
    ;   lines/s measured), saturating the UART and starving the boot right
    ;   after "webCfg done". The task was never WDT-guarded on the 4" either.
    ; STACK_SIZE=8192 - the 3.5 default is 16 KB (8192*2); with ~20 KB of
    ;   fragmented DRAM left after SoftAP start that single allocation fails
    ;   ("AsyncTCP: begin(): failed to start task" = dead web server). The
    ;   pinned AsyncTCP the 4" ships with has always used 8 KB for the same
    ;   handlers.
    -DCONFIG_ASYNC_TCP_USE_WDT=0
    -DCONFIG_ASYNC_TCP_STACK_SIZE=8192
    -Os
    -pipe

; Its own library set. LovyanGFX is gone (this board uses esp_lcd), and the web
; server is NOT pinned to the old commits: those were pinned because they broke
; on Arduino core 2.0.17, which is precisely the core we are leaving behind.
lib_deps =
    lvgl/lvgl @ ^8.4.0
    https://github.com/ttlappalainen/NMEA2000.git
    bblanchon/ArduinoJson @ ^7.2.0
    ESP32Async/AsyncTCP @ ^3.4.4
    ESP32Async/ESPAsyncWebServer @ ^3.7.7

monitor_speed = 115200
monitor_filters =
    esp32_exception_decoder
    time
upload_speed = 921600

[env:bringup_7b]
extends = env:waveshare_esp32s3_7b
build_src_filter = -<*> +<../bringup/>
; Override the inherited library list. PlatformIO builds every lib_deps entry
; even when nothing includes it, and the inherited web server pulls in
; WiFiServer.h and fails. The bring-up needs the panel driver and nothing else.
lib_deps =          ; none - the bring-up talks to esp_lcd directly

; ============================================================
; Waveshare ESP32-S3-Touch-LCD-5B — 5", 1024x600 (same panel resolution as
; the 7B, so it inherits the complete 600-grid UI via BOARD_PANEL_1024X600).
;
; Deliberately EXTENDS the 7B env: platform, the whole HybridCompile
; custom_sdkconfig (IRAM-safe LCD ISR, XIP-from-PSRAM, trimmed WiFi buffers),
; build_src_filter, lib_deps and extra_scripts are identical hardware-wise.
; Only four things differ, all of them below.
; ============================================================
[env:waveshare_esp32s3_5b]
extends = env:waveshare_esp32s3_7b
board = waveshare_esp32_s3_touch_lcd_5b

build_flags =
    -DBOARD_HAS_PSRAM
    ; Board identity: picks BoardConfig_5B.h in the BoardConfig.h dispatcher.
    -DBOARD_WAVESHARE_5B
    ; Same panel class as the 7B - this is what pulls in the entire 1024x600 UI.
    -DBOARD_PANEL_1024X600
    ; THE OPPOSITE OF THE 7B, and the single most important flag here: this
    ; board has NO USB-UART bridge. The console is the ESP32-S3's native
    ; USB-Serial/JTAG (enumerates as VID 0x303A / PID 0x1001), and UART0
    ; (GPIO43/44) is wired to the RS485 transceiver, so a UART console would
    ; talk onto the RS485 bus. With CDC off the board stays completely silent.
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DLV_CONF_INCLUDE_SIMPLE
    -DLV_LVGL_H_INCLUDE_SIMPLE
    -I src
    -DCORE_DEBUG_LEVEL=3
    -DLOG_LOCAL_LEVEL=ESP_LOG_INFO
    -DCONFIG_ASYNC_TCP_USE_WDT=0
    -DCONFIG_ASYNC_TCP_STACK_SIZE=8192
    -Os
    -pipe

; Native USB-Serial/JTAG ignores the baud rate (it is USB CDC), but esptool's
; stub loader plus a baud CHANGE is what fails here: reading the factory flash
; at 921600 aborted with "Packet content transfer stopped" partway through.
; Leave this at a modest value; add --no-stub if a transfer ever stalls.
upload_speed = 460800

; Panel-only bring-up for the 5B, same idea as bringup_7b: prove the RGB
; timings and the touch controller before the full firmware is involved.
[env:bringup_5b]
extends = env:waveshare_esp32s3_5b
build_src_filter = -<*> +<../bringup/>
lib_deps =          ; none - the bring-up talks to esp_lcd directly

; NOTE: there is deliberately NO env with "targets = uploadfs, upload" — both
; targets resolve to littlefs.bin in one run, so the firmware is silently
; skipped (verified). Full deploy = the custom "deploy" target from
; extra_script.py, which runs uploadfs and upload as two separate invocations:
;   pio run -t deploy

; ============================================================
; PC Simulator – runs on Windows/Linux with SDL2.
; Requires SDL2:
;   Windows (scoop):       scoop install sdl2
;   Windows (chocolatey):  choco install sdl2
;   Windows (winget):      winget install SDL2
;   Ubuntu/Debian:         sudo apt install libsdl2-dev
;
; Build:  pio run -e simulator
; Run:    .pio\build\simulator\program.exe
; ============================================================
; 7B variant of the PC simulator: same SDL build, but with BOARD_WAVESHARE_7B
; so the window is 1024x600 and the real rail/sidebar/home-overlay code paths
; compile and render - the workbench for the native-600 screen port (stage 3).
[env:simulator_7b]
extends = env:simulator
build_flags =
    ${env:simulator.build_flags}
    -DBOARD_WAVESHARE_7B
    -DBOARD_PANEL_1024X600

[env:simulator]
platform = native
build_type = debug
build_flags =
    -DSIMULATOR
    -DLVGL_SIMULATOR
    -DLV_CONF_INCLUDE_SIMPLE
    -DLV_LVGL_H_INCLUDE_SIMPLE
    ; Force-include simulator_defines.h as first file in every translation unit.
    ; This neutralises ESP32-specific attributes (IRAM_ATTR etc.) before any
    ; LVGL header can use them.
    -include sim/simulator_defines.h
    -I sim
    -I sim/freertos
    -I src
    -I src/display
    -D_REENTRANT
    ; SDL2 Pfade – passe an deine Installation an:
    ;   scoop:       C:/Users/NAME/scoop/apps/sdl2/current/include
    ;   manuell:     C:/SDL2/include
    -IC:/SDL2/include
    -LC:/SDL2/lib
    ; Falls scoop: diese Zeilen statt den oberen:
    ; -IC:/Users/<USER>/scoop/apps/sdl2/current/include
    ; -LC:/Users/<USER>/scoop/apps/sdl2/current/lib/x64
    -fpermissive
    -m64
    -lmingw32
    -lSDL2main
    -lSDL2
    -std=c++17
lib_deps =
    lvgl/lvgl @ ^8.4.0
    bblanchon/ArduinoJson @ ^7.2.0
build_src_filter =
    +<../sim/sim_main.cpp>
    +<../sim/sim_hal.cpp>
    +<../src/display/DisplayManager.cpp>
    +<../src/display/ConfigOverlay.cpp>
    +<../src/display/LicenseOverlay.cpp>
    +<../src/display/LanguageOverlay.cpp>
    ; SideBar/HomeOverlay: on non-7B these compile to just the inert global
    ; stub objects - but DisplayManager odr-uses them, so without the TUs the
    ; sim links only while -Og happens to fold the empty inline calls.
    ; (In env:simulator_7b they are the REAL implementations.)
    +<../src/display/SideBar.cpp>
    +<../src/display/HomeOverlay.cpp>
    +<../src/display/logo_mark.c>
    +<../src/display/Theme.cpp>
    +<../src/display/CanvasDraw.cpp>
    +<../src/display/BootScreen.cpp>
    ; hero numeric fonts + the latin_suppl_* umlaut fallbacks
    +<../src/display/fonts/*.c>
    +<../src/display/screens/WindScreen.cpp>
    +<../src/display/screens/SpeedScreen.cpp>
    +<../src/display/screens/DepthScreen.cpp>
    +<../src/display/screens/EngineScreen.cpp>
    +<../src/display/screens/RudderScreen.cpp>
    +<../src/display/screens/AutopilotScreen.cpp>
    +<../src/display/screens/GridScreen.cpp>
    +<../src/display/screens/AisScreen.cpp>
    +<../src/display/screens/WindPlotScreen.cpp>
    +<../src/display/screens/MediaScreen.cpp>
    +<../src/display/screens/AnchorScreen.cpp>
    +<../src/display/screens/TankScreen.cpp>
